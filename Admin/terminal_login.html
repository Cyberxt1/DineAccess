<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Login - University CAF System</title>
    <link rel="stylesheet" href="../button-roll.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
            background: radial-gradient(circle at 20% 20%, #fef3c7, transparent 55%),
                        radial-gradient(circle at 80% 0%, #bae6fd, transparent 45%),
                        linear-gradient(135deg, #0f172a, #1e293b);
            color: #e2e8f0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            max-width: 560px;
            width: 100%;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 30px 60px rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(12px);
        }

        .back-link {
            margin-bottom: 32px;
            text-align: left;
        }

        .back-link a {
            color: #bae6fd;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-link a:hover {
            color: #e0f2fe;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #fef3c7;
            margin-bottom: 8px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border: 1px solid rgba(254, 243, 199, 0.4);
            border-radius: 999px;
        }

        h1 {
            font-size: 34px;
            font-weight: 700;
            color: #f8fafc;
            margin-top: 16px;
            margin-bottom: 8px;
        }

        .description {
            font-size: 14px;
            color: #cbd5f5;
            line-height: 1.6;
        }

        .note {
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.28);
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 24px;
            font-size: 13px;
            line-height: 1.6;
            color: #dbeafe;
        }

        .form-grid {
            display: grid;
            gap: 18px;
        }

        .form-group {
            display: grid;
            gap: 8px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        label {
            font-weight: 500;
            color: #e2e8f0;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(148, 163, 184, 0.4);
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: rgba(15, 23, 42, 0.4);
            color: #f8fafc;
        }

        input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        .btn-group {
            display: grid;
            gap: 12px;
            margin-top: 28px;
        }

        .btn {
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            color: #ffffff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.35);
        }

        .btn:focus {
            outline: 2px solid #4299e1;
            outline-offset: 2px;
        }

        .error-message {
            color: #fecaca;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        @media (max-width: 640px) {
            .container {
                padding: 24px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="back-link">
            <a href="../index.html">&larr; Back to Home</a>
        </div>

        <header>
            <div class="logo">Terminal Access</div>
            <h1>Terminal Login</h1>
            <p class="description">Authenticate a scanner terminal before service begins.</p>
        </header>

        <div class="note">
            Use an authorized admin account together with the assigned terminal credentials. This keeps scanner access separate from the admin dashboard flow.
        </div>

        <form id="terminalLoginForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="email">Admin Email</label>
                    <input type="email" id="email" placeholder="admin@example.com" required value="admin@cafin.com">
                </div>

                <div class="form-group">
                    <label for="password">Admin Password</label>
                    <input type="password" id="password" placeholder="Enter password" required value="Admin@12345">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="terminalId">Terminal ID</label>
                        <input type="text" id="terminalId" placeholder="e.g. CAF-TERM-01" required>
                    </div>

                    <div class="form-group">
                        <label for="accessKey">Terminal Access Key</label>
                        <input type="password" id="accessKey" placeholder="Enter terminal key" required>
                    </div>
                </div>
            </div>

            <div class="error-message" id="errorMessage"></div>

            <div class="btn-group">
                <button type="submit" class="btn btn-primary">Open Scanner</button>
            </div>
        </form>
    </div>

    <script type="module">
        import { auth, db } from "../firebase.js";
        import { signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { collection, doc, getDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const form = document.getElementById('terminalLoginForm');
        const errorMessage = document.getElementById('errorMessage');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const terminalId = document.getElementById('terminalId').value.trim();
            const accessKey = document.getElementById('accessKey').value.trim();
            const submitButton = event.submitter || event.target.querySelector('button[type="submit"]');

            errorMessage.classList.remove('show');
            errorMessage.textContent = '';

            try {
                const credential = await signInWithEmailAndPassword(auth, email, password);
                const adminSnap = await getDoc(doc(db, 'admins', credential.user.uid));

                if (!adminSnap.exists()) {
                    await signOut(auth);
                    throw new Error('Access denied. This account is not an admin.');
                }

                const terminalQuery = query(
                    collection(db, 'terminals'),
                    where('terminalId', '==', terminalId),
                    where('accessKey', '==', accessKey)
                );
                const terminalSnapshot = await getDocs(terminalQuery);

                if (terminalSnapshot.empty) {
                    throw new Error('Terminal credentials are invalid.');
                }

                const terminalDoc = terminalSnapshot.docs[0];
                const terminal = terminalDoc.data();

                sessionStorage.setItem('cafTerminalSession', JSON.stringify({
                    terminalDocId: terminalDoc.id,
                    terminalId: terminal.terminalId || terminalId,
                    cafId: terminal.cafId || '',
                    location: terminal.location || '',
                    adminEmail: credential.user.email || email
                }));

                window.location.href = 'caf-scanner.html';
            } catch (error) {
                errorMessage.textContent = error.message || 'Unable to open scanner';
                errorMessage.classList.add('show');
                document.getElementById('password').value = '';
                document.getElementById('accessKey').value = '';
                window.ButtonRoll?.stop(submitButton);
            }
        });
    </script>
    <script src="../button-roll.js"></script>
</body>
</html>
